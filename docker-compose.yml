# Production compose: deterministic gateway + SOC console.
services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.s390x
    environment:
      MIRAGE_SECRET: ${MIRAGE_SECRET:-change-me-in-production}
      MIRAGE_MAX_TRIPWIRES: ${MIRAGE_MAX_TRIPWIRES:-12000}
      MIRAGE_MAX_VAULT_ENTRIES: ${MIRAGE_MAX_VAULT_ENTRIES:-12000}
      MIRAGE_DEMO_STEP_DELAY_SECONDS: ${MIRAGE_DEMO_STEP_DELAY_SECONDS:-30}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)",
        ]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3

  console:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_MIRAGE_API_URL: ${VITE_MIRAGE_API_URL:-http://localhost:8000}
    ports:
      - "8081:8081"
    depends_on:
      gateway:
        condition: service_healthy
