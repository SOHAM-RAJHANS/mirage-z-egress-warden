<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="590" viewBox="0 0 1440 590" fill="none" role="img" aria-labelledby="title description">
  <title id="title">MIRAGE-Z: keep real data in the vault, give the AI tracked decoys, block leaks at egress</title>
  <desc id="description">A visual flow from sensitive input through scanning, an in-memory vault, an AI sandbox with decoys, a deterministic egress gate, and a tamper-evident audit ledger.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1440" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset=".55" stop-color="#0C1730"/>
      <stop offset="1" stop-color="#15132C"/>
    </linearGradient>
    <linearGradient id="accent" x1="142" y1="0" x2="1288" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39D6C4"/>
      <stop offset=".52" stop-color="#8D7BFF"/>
      <stop offset="1" stop-color="#FF759E"/>
    </linearGradient>
    <linearGradient id="vault" x1="440" y1="183" x2="440" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123A42"/>
      <stop offset="1" stop-color="#102634"/>
    </linearGradient>
    <linearGradient id="sandbox" x1="753" y1="183" x2="753" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25234C"/>
      <stop offset="1" stop-color="#181D3B"/>
    </linearGradient>
    <linearGradient id="gate" x1="1065" y1="183" x2="1065" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3A2039"/>
      <stop offset="1" stop-color="#241B35"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#9BB4D1" stroke-opacity=".055"/>
    </pattern>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .muted { fill: #A9B6CE; }
      .label { fill: #DCE6F5; font-size: 17px; font-weight: 650; }
      .small { fill: #A9B6CE; font-size: 14px; }
      .card { stroke: #7586AA; stroke-opacity: .24; }
    </style>
  </defs>

  <rect width="1440" height="590" rx="28" fill="url(#background)"/>
  <rect width="1440" height="590" rx="28" fill="url(#grid)"/>
  <circle cx="220" cy="176" r="120" fill="#39D6C4" fill-opacity=".055" filter="url(#glow)"/>
  <circle cx="1102" cy="345" r="150" fill="#FF759E" fill-opacity=".05" filter="url(#glow)"/>
  <rect x="1" y="1" width="1438" height="588" rx="27" stroke="#A9B9D8" stroke-opacity=".16"/>

  <text x="72" y="78" class="sans" fill="#6CE5D4" font-size="14" font-weight="750" letter-spacing="2.4">ZERO-TRUST EGRESS · IBM LINUXONE</text>
  <text x="72" y="127" class="sans" fill="#F2F6FC" font-size="37" font-weight="760" letter-spacing="-1">The AI gets a decoy. The real data stays home.</text>
  <text x="73" y="158" class="sans muted" font-size="16">Inspect at ingress. Keep originals in memory. Make every unsafe exit earn a hard no.</text>

  <rect x="75" y="218" width="181" height="150" rx="20" fill="#14243A" class="card"/>
  <circle cx="112" cy="260" r="17" fill="#39D6C4" fill-opacity=".15"/>
  <path d="M106 254h12v13h-12zM108.5 251h7" stroke="#65E3D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="99" y="304" class="sans label">Sensitive input</text>
  <text x="99" y="331" class="sans small">Invoice · email · record</text>
  <text x="99" y="351" class="sans small">untrusted context</text>

  <path d="M271 293h53" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <path d="m316 286 9 7-9 7" stroke="#61DCCF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="340" y="194" width="260" height="198" rx="22" fill="url(#vault)" class="card"/>
  <rect x="340" y="194" width="260" height="3" rx="1.5" fill="#39D6C4"/>
  <circle cx="378" cy="238" r="18" fill="#39D6C4" fill-opacity=".14"/>
  <path d="M372 236v-4a6 6 0 0 1 12 0v4m-14 0h16v12h-16z" stroke="#6CE5D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="369" y="286" class="sans label">Private vault</text>
  <text x="369" y="314" class="sans small">Real values stay in memory.</text>
  <text x="369" y="337" class="sans small">Fixed rules create a tracked</text>
  <text x="369" y="360" class="sans small">decoy before the agent sees it.</text>

  <path d="M616 293h67" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <path d="m675 286 9 7-9 7" stroke="#9988FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="702" y="194" width="257" height="198" rx="22" fill="url(#sandbox)" class="card"/>
  <rect x="702" y="194" width="257" height="3" rx="1.5" fill="#9A86FF"/>
  <circle cx="740" cy="238" r="18" fill="#9A86FF" fill-opacity=".15"/>
  <path d="M732 233h16v12h-16zM736 230h8m-12 18h16" stroke="#B8AAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="731" y="286" class="sans label">Agent sandbox</text>
  <text x="731" y="314" class="sans small">The task still works with</text>
  <text x="731" y="337" class="sans small">checksum-valid decoys. No</text>
  <text x="731" y="360" class="sans small">real card number in context.</text>

  <path d="M975 293h65" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <path d="m1032 286 9 7-9 7" stroke="#F486B6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="1058" y="194" width="267" height="198" rx="22" fill="url(#gate)" class="card"/>
  <rect x="1058" y="194" width="267" height="3" rx="1.5" fill="#FF759E"/>
  <circle cx="1097" cy="238" r="18" fill="#FF759E" fill-opacity=".14"/>
  <path d="M1097 226l11 4v8c0 7-5 12-11 15-6-3-11-8-11-15v-8z" stroke="#FF9EB9" stroke-width="2" stroke-linejoin="round"/>
  <path d="m1092 238 4 4 7-8" stroke="#FF9EB9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1088" y="286" class="sans label">Egress gate</text>
  <text x="1088" y="314" class="sans small">Canonicalize, inspect, decide.</text>
  <text x="1088" y="337" class="sans small">Unsafe decoy outbound?</text>
  <text x="1088" y="360" class="sans" fill="#FF9EB9" font-size="14" font-weight="700">BLOCK · ALERT · RECORD</text>

  <path d="M1190 410v27H715v-24" stroke="#9A86FF" stroke-opacity=".64" stroke-width="2" stroke-dasharray="5 7" stroke-linecap="round"/>
  <rect x="525" y="425" width="380" height="79" rx="18" fill="#171D36" stroke="#9A86FF" stroke-opacity=".35"/>
  <circle cx="560" cy="464" r="17" fill="#9A86FF" fill-opacity=".15"/>
  <path d="M552 464l6 6 11-13m-17-4h20v23h-20z" stroke="#B8AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="592" y="458" class="sans label">Tamper-evident ledger</text>
  <text x="592" y="482" class="sans small">SHA-256 chain · detect · verify · restore</text>

  <text x="72" y="548" class="sans" fill="#8292AD" font-size="13" letter-spacing="1.3">DETERMINISTIC BY DESIGN · NO SECOND AI JUDGE AT THE EXIT</text>
  <rect x="1218" y="525" width="150" height="36" rx="18" fill="#15302F" stroke="#39D6C4" stroke-opacity=".38"/>
  <circle cx="1240" cy="543" r="4" fill="#6CE5D4"/>
  <text x="1253" y="548" class="sans" fill="#BCEEE7" font-size="12" font-weight="700" letter-spacing=".8">MIRAGE-Z</text>
</svg>
